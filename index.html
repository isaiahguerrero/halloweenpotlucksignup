<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Potluck Sign-Up</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    background: #faf8f5;
    color: #2c2a26;
  }
  h1 { font-size: 24px; margin-bottom: 4px; }
  p.sub { color: #6b6862; margin-top: 0; margin-bottom: 24px; }
  h2.section-title { font-size: 17px; margin: 28px 0 12px; color: #2c2a26; }
  .card {
    background: #fff;
    border: 1px solid #e7e3da;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .entry-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .entry-name { font-weight: 600; font-size: 15px; }
  .entry-food { font-size: 14px; margin-top: 2px; }
  .tags { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #f0ede6;
    color: #6b5a3f;
    font-weight: 600;
  }
  .tag.gf { background: #e6f2e6; color: #3a6b3a; }
  .tag.df { background: #e6eef7; color: #2f5a8a; }
  .actions { display: flex; gap: 6px; flex-shrink: 0; }
  button {
    background: #8a5a2b;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #714a22; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button.secondary {
    background: #fff;
    color: #8a5a2b;
    border: 1px solid #d8c4a8;
  }
  button.secondary:hover { background: #f5efe4; }
  button.danger {
    background: #fff;
    color: #a33a2a;
    border: 1px solid #e0b6ab;
  }
  button.danger:hover { background: #fdf0ee; }
  .empty { color: #9a9184; font-style: italic; text-align: center; padding: 20px 0; }
  .form-card {
    background: #fff;
    border: 1px solid #e7e3da;
    border-radius: 12px;
    padding: 16px;
  }
  .form-title { font-weight: 600; margin-bottom: 4px; font-size: 15px; }
  .form-hint { font-size: 12px; color: #9a9184; margin-bottom: 8px; }
  label { font-size: 13px; color: #6b6862; display: block; margin-bottom: 4px; margin-top: 10px; }
  input[type=text] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #d8d2c4;
    border-radius: 8px;
    font-size: 14px;
  }
  .checks { display: flex; gap: 16px; margin-top: 10px; }
  .checks label { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 14px; color: #2c2a26; }
  .checks input { width: auto; }
  .form-buttons { margin-top: 14px; display: flex; gap: 8px; }
  #status { font-size: 13px; color: #6b6862; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>

<h1>🎉 Halloween Potluck Sign-Up</h1>
<p class="sub">Add your name, a 4-digit PIN (so only you can edit or delete your entry later), and what you're bringing.</p>

<div class="form-card">
  <div class="form-title" id="formTitle">Add yourself</div>
  <div class="form-hint">Remember your PIN — you'll need it again to edit or delete your entry.</div>
  <label for="fName">Your name</label>
  <input type="text" id="fName" placeholder="e.g. Isaiah">
  <label for="fPin">4-digit PIN</label>
  <input type="text" id="fPin" placeholder="e.g. 4821" maxlength="4" inputmode="numeric">
  <label for="fFood">What you're bringing</label>
  <input type="text" id="fFood" placeholder="e.g. Elote pasta salad">
  <div class="checks">
    <label><input type="checkbox" id="fGF"> Gluten-free</label>
    <label><input type="checkbox" id="fDF"> Dairy-free</label>
  </div>
  <div class="form-buttons">
    <button onclick="submitEntry()" id="submitBtn">Add</button>
    <button class="secondary" style="display:none" id="cancelBtn" onclick="cancelEdit()">Cancel</button>
  </div>
</div>

<h2 class="section-title">What people are bringing so far</h2>
<div id="board"><div class="empty">Loading…</div></div>

<div id="status"></div>

<script>
/* ====== CONFIGURE THESE THREE VALUES ====== */
const GITHUB_OWNER = "isaiahguerrero";
const GITHUB_REPO = "halloweenpotlucksignup";
const GITHUB_TOKEN = "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";
/* =========================================== */

const DATA_PATH = "data.json";
const API_URL = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_PATH}`;

let entries = [];
let currentSha = null;
let editingId = null;

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
  setTimeout(() => { document.getElementById('status').textContent = ''; }, 3000);
}

function b64EncodeUnicode(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUnicode(str) {
  return decodeURIComponent(escape(atob(str)));
}

async function loadEntries() {
  try {
    const res = await fetch(API_URL + "?t=" + Date.now(), {
      headers: {
        "Authorization": `Bearer ${GITHUB_TOKEN}`,
        "Accept": "application/vnd.github+json"
      }
    });
    if (!res.ok) throw new Error("Failed to load: " + res.status);
    const data = await res.json();
    currentSha = data.sha;
    entries = JSON.parse(b64DecodeUnicode(data.content));
  } catch (e) {
    console.error(e);
    setStatus("Couldn't load the sign-up list. Check the setup at the top of this file.");
    entries = [];
  }
  render();
}

async function saveEntries(commitMessage) {
  try {
    const body = {
      message: commitMessage,
      content: b64EncodeUnicode(JSON.stringify(entries, null, 2)),
      sha: currentSha
    };
    const res = await fetch(API_URL, {
      method: "PUT",
      headers: {
        "Authorization": `Bearer ${GITHUB_TOKEN}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      if (res.status === 409) {
        setStatus("Someone else just updated the list — refreshing, try again.");
        await loadEntries();
        return false;
      }
      throw new Error("Save failed: " + res.status);
    }
    const data = await res.json();
    currentSha = data.content.sha;
    return true;
  } catch (e) {
    console.error(e);
    setStatus("Couldn't save. Check the token/setup at the top of this file.");
    return false;
  }
}

function cryptoId() {
  return Math.random().toString(36).slice(2, 10);
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function render() {
  const board = document.getElementById('board');
  board.innerHTML = "";
  if (entries.length === 0) {
    board.innerHTML = '<div class="empty">No one has signed up yet — be the first!</div>';
    return;
  }
  entries.forEach(e => {
    const card = document.createElement('div');
    card.className = 'card';
    let tags = '';
    if (e.gf) tags += '<span class="tag gf">Gluten-free</span>';
    if (e.df) tags += '<span class="tag df">Dairy-free</span>';
    card.innerHTML = `
      <div class="entry-top">
        <div>
          <div class="entry-name">${escapeHtml(e.name)}</div>
          <div class="entry-food">${escapeHtml(e.food)}</div>
          ${tags ? `<div class="tags">${tags}</div>` : ''}
        </div>
        <div class="actions">
          <button class="secondary" data-action="edit" data-id="${e.id}">Edit</button>
          <button class="danger" data-action="delete" data-id="${e.id}">Delete</button>
        </div>
      </div>
    `;
    board.appendChild(card);
  });

  board.querySelectorAll('[data-action="edit"]').forEach(btn => {
    btn.onclick = () => requestEdit(btn.dataset.id);
  });
  board.querySelectorAll('[data-action="delete"]').forEach(btn => {
    btn.onclick = () => requestDelete(btn.dataset.id);
  });
}

function requestEdit(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  const pin = prompt("Enter your 4-digit PIN to edit this entry:");
  if (pin === null) return;
  if (pin.trim() !== e.pin) {
    setStatus("Wrong PIN for this entry.");
    return;
  }
  editingId = id;
  document.getElementById('fName').value = e.name;
  document.getElementById('fPin').value = e.pin;
  document.getElementById('fFood').value = e.food;
  document.getElementById('fGF').checked = !!e.gf;
  document.getElementById('fDF').checked = !!e.df;
  document.getElementById('formTitle').textContent = 'Edit your entry';
  document.getElementById('submitBtn').textContent = 'Save changes';
  document.getElementById('cancelBtn').style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
  editingId = null;
  document.getElementById('fName').value = '';
  document.getElementById('fPin').value = '';
  document.getElementById('fFood').value = '';
  document.getElementById('fGF').checked = false;
  document.getElementById('fDF').checked = false;
  document.getElementById('formTitle').textContent = 'Add yourself';
  document.getElementById('submitBtn').textContent = 'Add';
  document.getElementById('cancelBtn').style.display = 'none';
}

function setFormDisabled(disabled) {
  document.getElementById('submitBtn').disabled = disabled;
}

async function submitEntry() {
  const name = document.getElementById('fName').value.trim();
  const pin = document.getElementById('fPin').value.trim();
  const food = document.getElementById('fFood').value.trim();
  const gf = document.getElementById('fGF').checked;
  const df = document.getElementById('fDF').checked;

  if (!name || !food) {
    setStatus("Enter your name and what you're bringing.");
    return;
  }
  if (!/^\d{4}$/.test(pin)) {
    setStatus("PIN must be exactly 4 digits.");
    return;
  }

  setFormDisabled(true);

  if (editingId) {
    const e = entries.find(x => x.id === editingId);
    if (e) {
      e.name = name;
      e.pin = pin;
      e.food = food;
      e.gf = gf;
      e.df = df;
    }
    const ok = await saveEntries(`Update entry for ${name}`);
    if (ok) setStatus("Updated.");
  } else {
    entries.push({ id: cryptoId(), name, pin, food, gf, df });
    const ok = await saveEntries(`Add entry for ${name}`);
    if (ok) setStatus("Added.");
  }

  setFormDisabled(false);
  cancelEdit();
  render();
}

async function requestDelete(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  const pin = prompt("Enter your 4-digit PIN to delete this entry:");
  if (pin === null) return;
  if (pin.trim() !== e.pin) {
    setStatus("Wrong PIN for this entry.");
    return;
  }
  if (!confirm("Remove this entry?")) return;
  entries = entries.filter(x => x.id !== id);
  const ok = await saveEntries(`Remove entry for ${e.name}`);
  if (ok) setStatus("Removed.");
  render();
}

loadEntries();
</script>

</body>
</html>
